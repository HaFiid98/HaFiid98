name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: HaFiid98
          filename: github-metrics.svg

          base: header, activity, repositories

          plugin_languages: yes
          plugin_activity: yes
          plugin_lines: yes
          plugin_notable: yes